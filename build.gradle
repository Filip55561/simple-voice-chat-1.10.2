repositories {
    maven { url "https://repo.spongepowered.org/maven" }
    maven { url "https://maven.maxhenkel.de/releases" }
}

buildscript {
    repositories {
        maven { url "https://repo.spongepowered.org/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.2.5'
        classpath "org.spongepowered:mixingradle:0.6-SNAPSHOT"
        classpath 'com.github.jengelman.gradle.plugins:shadow:1.2.4'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'com.github.johnrengelman.shadow'

//Only edit below this line, the above code adds and enables the nessasary things for Forge to be setup.

version = "1.0.3"
ext {
     mod_compatible_version= "2.6.x"
}
group= "de.maxhenkel.voicechat" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "voicechat"

sourceCompatibility = targetCompatibility = "1.8" // Need this here so eclipse task generates correctly.
compileJava {
    sourceCompatibility = targetCompatibility = "1.8"
}

minecraft {
    version = "1.10.2-12.18.3.2477"
    runDir = "run"
    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not allways work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = "snapshot_20161111"
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
}

dependencies {
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
    deobfCompile "org.spongepowered:mixin:0.7.1-SNAPSHOT"
    shadow 'org.spongepowered:mixin:0.7.1-SNAPSHOT'

    deobfCompile "org.concentus:Concentus:1.0.1"
    shadow "org.concentus:Concentus:1.0.1"

    deobfCompile "de.maxhenkel.opus4j:opus4j:2.1.3"
    shadow "de.maxhenkel.opus4j:opus4j:2.1.3"

    deobfCompile "de.maxhenkel.rnnoise4j:rnnoise4j:2.1.3"
    shadow "de.maxhenkel.rnnoise4j:rnnoise4j:2.1.3"

    deobfCompile "de.maxhenkel.lame4j:lame4j:2.1.5"
    shadow "de.maxhenkel.lame4j:lame4j:2.1.5"

    deobfCompile "de.maxhenkel.speex4j:speex4j:1.0.3"
    shadow "de.maxhenkel.speex4j:speex4j:1.0.3"

    deobfCompile "de.maxhenkel.configbuilder:configbuilder:2.1.0"
    shadow "de.maxhenkel.configbuilder:configbuilder:2.1.0"
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // the 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    //provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // the deobf configurations:  'deobfCompile' and 'deobfProvided' are the same as the normal compile and provided,
    // except that these dependencies get remapped to your current MCP mappings
    //deobfCompile 'com.mod-buildcraft:buildcraft:6.0.8:dev'
    //deobfProvided 'com.mod-buildcraft:buildcraft:6.0.8:dev'
    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

shadowJar {
    classifier = null
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    relocate 'org.concentus', 'de.maxhenkel.voicechat.concentus'

    manifest {
        attributes([
            'FMLCorePluginContainsFMLMod': 'true',
            'FMLCorePlugin'              : 'de.maxhenkel.voicechat.mixin.MixinCoreMod',
            'ForceLoadAsMod'             : 'true',
            'TweakClass'                 : 'org.spongepowered.asm.launch.MixinTweaker',
            'TweakOrder'                 : '0'
        ])
    }
}

reobf {
	shadowJar {}
}

build.dependsOn reobfShadowJar

sourceSets {
    main {
        java {
            // TODO: Try to figure out how to do this better
            srcDirs = ['common/src/main/java', 'common/src/template/java','common-client/src/main/java', 'forge/src/main/java', 'api/src/main/java']
        }
    }
}

mixin {
   add sourceSets.main, "voicechat.refmap.json"
}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    inputs.property "mod_compatible_version", mod_compatible_version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

